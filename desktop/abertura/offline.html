<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <meta name="color-scheme" content="dark light" />
  <title>OperacionalOS: sem conexão</title>
  <link rel="stylesheet" href="offline.css" />
</head>
<body>
  <!-- Página local da janela principal quando o OperacionalOS não carrega (modo limitado). -->
  <main class="caixa">
    <svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="50" fill="#1b2432" />
      <polygon points="18.57,9.05 82.02,9.05 82.02,26.19 42.74,73.21 82.02,73.21 82.02,89.88 15.0,89.88 15.0,75.36 57.26,26.19 18.57,26.19" fill="#fff" />
      <line x1="21.79" y1="83.45" x2="75.6" y2="15.48" stroke="#ea5b25" stroke-width="2.62" />
      <circle cx="21.79" cy="83.45" r="6.55" fill="#ea5b25" />
      <circle cx="48.21" cy="51.07" r="6.55" fill="#ea5b25" />
      <circle cx="75.6" cy="15.48" r="6.55" fill="#ea5b25" />
    </svg>
    <p class="rotulo">Modo limitado</p>
    <h1>Sem conexão com o OperacionalOS</h1>
    <p class="texto">Se este PC estiver liberado, o motor segue ligado e tenta de novo sozinho. As telas voltam quando a internet voltar.</p>
    <button type="button" id="tentar">Tentar de novo</button>
  </main>
  <script src="offline.js"></script>
</body>
</html>
