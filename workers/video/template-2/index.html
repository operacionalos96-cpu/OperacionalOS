<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visão de presença digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
/* Mesma identidade da apresentação comercial HZK */
:root{
  --bg:#070A12; --panel:#111829; --panel2:#0E1B3A; --line:#243049; --line2:#2D3A5C;
  --text:#F2F4F8; --muted:#A7B0C4; --muted2:#8590A8; --accent:#7FA6FF; --mint:#7EF0C9; --blue:#2563E0;
  --brand:#2563E0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:calc(50% - 32px);width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:center center}
body.render #stage{left:0;top:0;transform:none!important}

.bg{position:absolute;inset:0;overflow:hidden}
.glow{position:absolute;width:1700px;height:1700px;left:-300px;top:-900px;border-radius:50%;background:radial-gradient(circle,rgba(23,50,118,.85),rgba(11,18,38,.4) 40%,transparent 68%)}
.glow2{position:absolute;width:1300px;height:1300px;right:-600px;bottom:-700px;border-radius:50%;background:radial-gradient(circle,rgba(45,191,149,.16),transparent 62%)}
.grid{position:absolute;inset:-10%;opacity:.45;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:84px 84px;-webkit-mask-image:radial-gradient(ellipse at center,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at center,#000 15%,transparent 70%)}

.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:64px;padding:150px 80px;visibility:hidden;opacity:0}
.hwrap{display:grid;place-items:center;width:100%}
.hwrap>*{grid-area:1/1}
.h{font-family:'Sora',sans-serif;font-weight:600;font-size:72px;line-height:1.1;letter-spacing:-.035em;text-align:center;width:100%}
.h.sm{font-size:58px}
.h.xl{font-size:96px}
.l{display:block}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .16em;margin-bottom:-.16em}
.wi{display:inline-block}
.mint{color:var(--mint)} .accent{color:var(--accent)} .muted{color:var(--muted)}
.grad .wi{background:linear-gradient(90deg,#8fb2ff,#7ef0c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.nameL{white-space:nowrap}
.eyebrow{font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);text-align:center}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* cartões no padrão da apresentação */
.card{border-radius:24px;background:var(--panel);border:1px solid var(--line)}
.card.hi{background:var(--panel2);border:2px solid var(--blue);box-shadow:0 30px 100px -30px rgba(37,99,224,.6)}

/* navegador */
.browser{width:920px;border-radius:24px;background:#0b1019;border:1px solid var(--line2);overflow:hidden;box-shadow:0 40px 100px -30px rgba(0,0,0,.85);flex:none;position:relative}
.bbar{height:50px;display:flex;align-items:center;gap:9px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.bbar i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.16)}
.bbar span{margin-left:14px;font-size:20px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:680px}
.shot{height:575px;overflow:hidden;background:#fff}
.shot img{width:920px;display:block;filter:saturate(.55) brightness(.75)}
.ptag{position:absolute;left:24px;bottom:24px;display:flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;background:rgba(7,10,18,.88);border:1px solid rgba(255,138,112,.5);font-size:24px;font-weight:500}
.ptag b{color:#ff8a70;font-weight:600}

/* busca */
.search{width:920px;height:108px;border-radius:54px;display:flex;align-items:center;gap:20px;padding:0 36px;font-size:38px;font-weight:500;background:#0F1524;border:1.5px solid var(--line2)}
.search svg{flex:none;width:40px;height:40px;color:var(--muted2)}
.caret{flex:none;width:3px;height:44px;background:var(--accent);margin-left:-12px}
.enter{margin-left:auto;padding:10px 20px;border-radius:14px;background:rgba(255,255,255,.08);font-size:22px;color:var(--muted)}
.list{width:920px;display:flex;flex-direction:column;gap:16px}
.li{display:flex;align-items:center;gap:22px;padding:24px 30px;font-size:38px;font-weight:500}
.chk{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(126,240,201,.14);color:var(--mint);font-size:28px}

/* site conceito (cor da marca) */
.hero{padding:56px 48px;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 45%,#05070c));display:flex;flex-direction:column;gap:22px}
.hero .k{font-size:22px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.hero h3{font-family:Sora;font-size:60px;font-weight:700;line-height:1.05;letter-spacing:-.03em}
.hero p{font-size:30px;opacity:.92}
.hero .cta{align-self:flex-start;padding:16px 30px;border-radius:999px;background:#fff;color:#0b1019;font-size:24px;font-weight:600}
.cnav{display:flex;justify-content:space-between;align-items:center;padding:24px 40px;background:#0b1019}
.cnav b{font-family:Sora;font-size:26px;font-weight:700}
.cnav span{display:flex;gap:14px}.cnav span i{width:64px;height:10px;border-radius:5px;background:rgba(255,255,255,.14)}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;width:920px}
.word{padding:18px 30px;border-radius:999px;font-family:Sora;font-size:30px;font-weight:600;background:var(--panel);border:1px solid var(--line2)}

/* seções (quebra-cabeça → estrutura) */
.secs{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:920px}
.sec{padding:34px 30px;display:flex;align-items:center;gap:18px;font-family:Sora;font-size:32px;font-weight:600;border-left:4px solid var(--line2)}
.sec b{flex:none;width:16px;height:16px;border-radius:50%;background:var(--brand)}

/* página percorrida */
.page{width:920px;height:760px;overflow:hidden;position:relative;border-radius:24px;border:1px solid var(--line2);background:#0b1019}
.page .track{position:absolute;left:0;right:0;top:0;padding:28px;display:flex;flex-direction:column;gap:22px}
.pq{border-radius:20px;padding:34px 32px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px;height:250px}
.pq .q{font-family:Sora;font-size:36px;font-weight:600}
.pq .sk{height:14px;border-radius:7px;background:rgba(255,255,255,.1)}

/* jornada / fluxos */
.flow{display:flex;flex-direction:column;align-items:center;gap:10px;width:920px}
.node{width:640px;text-align:center;padding:26px;font-family:Sora;font-size:36px;font-weight:600}
.arrow{width:2px;height:34px;background:linear-gradient(var(--line2),var(--accent))}

/* informação estruturada */
.data{width:920px;padding:40px 44px;display:flex;flex-direction:column;gap:6px;font-size:30px}
.row{display:flex;gap:20px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.row:last-child{border-bottom:0}
.row .k{width:220px;flex:none;color:var(--muted2);font-size:24px;letter-spacing:.12em;text-transform:uppercase;padding-top:5px}
.row .v{font-weight:600}
.chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:920px}
.chip{padding:16px 28px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);font-size:28px;font-weight:500;display:flex;align-items:center;gap:12px}
.chip::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--mint)}

/* antes / depois */
.ba{width:920px;display:flex;flex-direction:column;gap:22px}
.bar2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ba .lbl{font-size:22px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:0 6px}
.ba .a,.ba .d{padding:26px 26px;font-size:28px;line-height:1.3;border-radius:20px}
.ba .a{color:var(--muted);background:#10151F;border:1px solid #232B3D}
.ba .d{font-weight:600;background:var(--panel2);border:2px solid var(--blue)}

/* HZK */
.hzk img{height:220px;display:block}
.chain{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;width:920px}
.chain .c{padding:22px 10px;text-align:center;font-family:Sora;font-size:26px;font-weight:600}
.steps{display:flex;flex-direction:column;gap:18px;width:920px}
.st{display:flex;gap:28px;align-items:center;padding:28px 34px;border-top:4px solid var(--blue)}
.st .n{font-family:Sora;font-size:30px;font-weight:700;color:var(--accent);flex:none;width:56px}
.st .t{font-family:Sora;font-size:36px;font-weight:700}
.st .d{font-size:26px;color:var(--muted);margin-top:4px}

/* final */
.meet{width:920px;display:flex;flex-direction:column;align-items:center;gap:40px;padding:80px 60px;border-radius:44px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--line2);box-shadow:0 0 160px -30px rgba(111,156,255,.45)}
.pair{display:flex;align-items:center;justify-content:center;gap:28px;width:100%}
.pair .x{font-family:Sora;font-size:56px;color:var(--muted2)}
.pair img{height:110px}
.pill{padding:18px 36px;border-radius:999px;background:var(--mint);color:#04130d;font-family:Sora;font-size:32px;font-weight:600}
.cta2{font-size:36px;color:var(--muted);text-align:center;line-height:1.35}

#ctrl{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#0b0e15;border-top:1px solid #1c2230;font:500 14px Inter,sans-serif;color:#cfd5e2}
#ctrl button{background:#1b2232;color:#e8ecf4;border:1px solid #2a3346;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
#ctrl input{flex:1;accent-color:#79a3ff}
body.render #ctrl{display:none}
</style>
<script>
  (function () {
    const d = new URLSearchParams(location.search).get('d') || '../.trabalho/exemplo';
    document.write('<script src="' + d + '/dados.js"><\/script>');
  })();
</script>
</head>
<body>
<div id="stage">
  <div class="bg"><div class="glow"></div><div class="glow2"></div><div class="grid"></div></div>

  <!-- 01 Continuidade: o site atual, de passagem -->
  <section class="scene" id="s1">
    <p class="eyebrow" data-t="s1_eyebrow"></p>
    <div class="hwrap">
      <div class="h" id="s1g1"><span class="l grad nameL" data-t="s1_a"></span><span class="l sm" data-t="s1_b" style="font-size:52px;margin-top:14px"></span></div>
      <div class="h sm" id="s1g2"><span class="l muted" data-t="s1_c"></span><span class="l" data-t="s1_d" style="margin-top:12px"></span></div>
    </div>
    <div class="browser" id="s1br"><div class="bbar"><i></i><i></i><i></i><span data-f="url"></span></div>
      <div class="shot"><img data-src="home" alt=""></div>
      <div class="ptag" id="s1tag"><span data-t="s1_tag"></span>: <b data-f="problema"></b></div>
    </div>
  </section>

  <!-- 02 Busca → o que a pessoa entende -->
  <section class="scene" id="s2">
    <div class="hwrap">
      <div class="h sm" id="s2g1"><span class="l" data-t="s2_a"></span></div>
      <div class="h sm" id="s2g2"><span class="l" data-t="s2_b"></span></div>
    </div>
    <div class="search" id="s2box"><i data-i="search"></i><span id="sq"></span><span class="caret" id="s2caret"></span><span class="enter" id="s2enter">Enter ↵</span></div>
    <div class="list" id="s2list"></div>
  </section>

  <!-- 03 Primeira impressão (cor da marca) -->
  <section class="scene" id="s3">
    <div class="hwrap">
      <div class="h sm" id="s3g1"><span class="l" data-t="s3_a"></span></div>
      <div class="h sm" id="s3g2"><span class="l" data-t="s3_b"></span></div>
    </div>
    <div class="browser" id="s3br"><div class="bbar"><i></i><i></i><i></i><span data-f="url"></span></div>
      <div class="cnav"><b data-f="empresa"></b><span><i></i><i></i><i></i></span></div>
      <div class="hero"><p class="k" id="s3k" data-f="cidadeK"></p><h3 data-f="servico"></h3><p id="s3dif" data-f="diferencial"></p><span class="cta">Fale com a equipe</span></div>
    </div>
    <div class="words" id="s3w"></div>
  </section>

  <!-- 04 O valor deixa de ficar escondido -->
  <section class="scene" id="s4">
    <div class="hwrap">
      <div class="h sm" id="s4g1"><span class="l" data-t="s4_a"></span></div>
      <div class="h sm" id="s4g2"><span class="l" data-t="s4_b"></span></div>
      <div class="h sm" id="s4g3"><span class="l" data-t="s4_c"></span></div>
    </div>
    <div class="secs" id="s4secs"></div>
  </section>

  <!-- 05 Não é um catálogo -->
  <section class="scene" id="s5">
    <div class="hwrap">
      <div class="h sm" id="s5g1"><span class="l" data-t="s5_a"></span></div>
      <div class="h sm" id="s5g2"><span class="l" data-t="s5_b"></span></div>
    </div>
    <div class="page"><div class="track" id="s5track"></div></div>
  </section>

  <!-- 06 Jornada -->
  <section class="scene" id="s6">
    <div class="flow" id="s6flow"></div>
    <div class="h sm" id="s6g1"><span class="l" data-t="s6_a"></span></div>
  </section>

  <!-- 07 Buscadores e IA -->
  <section class="scene" id="s7">
    <div class="hwrap">
      <div class="h sm" id="s7g1"><span class="l" data-t="s7_a"></span></div>
      <div class="h sm" id="s7g2"><span class="l" data-t="s7_b"></span></div>
    </div>
    <div class="card data" id="s7data"></div>
    <div class="chips" id="s7chips"></div>
  </section>

  <!-- 08 A transformação -->
  <section class="scene" id="s8">
    <div class="ba" id="s8ba"></div>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:48px;padding:150px 80px">
      <div class="h xl" id="s8a"><span class="l" data-t="s8_a"></span></div>
      <div class="hwrap">
        <div class="h" id="s8b"><span class="l muted" data-t="s8_b"></span></div>
        <div class="h" id="s8c"><span class="l" data-t="s8_c"></span></div>
      </div>
    </div>
  </section>

  <!-- 09 Entra a HZK -->
  <section class="scene" id="s9">
    <div class="hzk" id="s9logo"><img id="hzkLogo" alt="HZK Company"></div>
    <div class="hwrap">
      <div class="h" id="s9g1"><span class="l" data-t="s9_a"></span><span class="l mint" data-t="s9_b" style="font-size:44px;margin-top:16px"></span></div>
      <div class="h sm" id="s9g2"><span class="l" data-t="s9_c"></span></div>
    </div>
    <div class="chain" id="s9chain"></div>
  </section>

  <!-- 10 O processo -->
  <section class="scene" id="s10">
    <div class="steps" id="s10steps"></div>
    <div class="h sm" id="s10g1"><span class="l" data-t="s10_a"></span></div>
  </section>

  <!-- 11 Projeção -->
  <section class="scene" id="s11">
    <div class="h xl" id="s11name"><span class="l grad nameL" data-f="empresa"></span></div>
    <div class="hwrap">
      <div class="h" id="s11g1"><span class="l" data-t="s11_a"></span></div>
      <div class="h sm" id="s11g2"><span class="l" data-t="s11_b"></span></div>
    </div>
    <div class="words" id="s11w"></div>
  </section>

  <!-- 12 Fechamento -->
  <section class="scene" id="s12">
    <div class="hwrap">
      <div class="h sm" id="s12g1"><span class="l muted" data-t="s12_a"></span><span class="l" data-t="s12_b" style="margin-top:12px"></span></div>
      <div class="meet" id="s12meet">
        <div class="pair"><span class="h sm nameL grad" style="width:auto" id="s12name"><span class="l" data-f="empresa"></span></span><span class="x">×</span><img id="hzkLogo2" alt="HZK Company"></div>
        <p class="cta2" data-t="s12_cta"></p>
        <p class="pill" data-t="s12_pill"></p>
      </div>
    </div>
  </section>
</div>

<div id="ctrl"><button id="play">Pausar</button><span id="time">0.0</span><input type="range" id="scrub" min="0" max="1000" value="0"></div>

<script src="../template/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const F = window.FICHA, C = window.CONFIG, TX = F.textos;
const stage = $('#stage');
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
const rich = s => esc(s).replace(/\*(.+?)\*/g, '<span class="mint">$1</span>');
const parts = k => (TX[k] || '').split('|').filter(Boolean);
const ICON = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
};
const svg = n => `<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;

// ---------- ficha → DOM (personalização em um lugar só) ----------
F.cidadeK = [F.segmento, F.cidade].filter(Boolean).join(' · ');
$$('[data-f]').forEach(e => e.textContent = F[e.dataset.f] ?? '');
$$('[data-t]').forEach(e => e.innerHTML = rich(TX[e.dataset.t] || ''));
$$('[data-src]').forEach(e => e.src = F[e.dataset.src]);
$$('[data-i]').forEach(e => e.outerHTML = svg(e.dataset.i));
if (F.cor) document.documentElement.style.setProperty('--brand', F.cor);
if (!F.problema) $('#s1tag').remove();
if (!F.diferencial) $('#s3dif').remove();
if (!F.cidadeK) $('#s3k').remove();
$('#hzkLogo').src = $('#hzkLogo2').src = C.assinatura_logo;
$('#s2list').innerHTML = parts('s2_items').map(t => `<div class="card li"><span class="chk">${svg('check')}</span>${esc(t)}</div>`).join('');
$('#s3w').innerHTML = parts('s3_words').map(t => `<span class="word">${esc(t)}</span>`).join('');
$('#s4secs').innerHTML = parts('s4_sections').map(t => `<div class="card sec"><b></b>${esc(t)}</div>`).join('');
$('#s5track').innerHTML = parts('s5_q').map(q => `<div class="pq"><span class="q">${esc(q)}</span><span class="sk" style="width:86%"></span><span class="sk" style="width:64%"></span></div>`).join('');
$('#s6flow').innerHTML = parts('s6_steps').map((t, i) => `${i ? '<span class="arrow"></span>' : ''}<div class="card node${i === 3 ? ' hi' : ''}">${esc(t)}</div>`).join('');
const dataRows = [['Empresa', F.empresa], ['Segmento', F.segmento], ['Cidade', F.cidade], ['Serviço', F.servico], ['Diferencial', F.diferencial]].filter(([, v]) => v);
$('#s7data').innerHTML = dataRows.map(([k, v]) => `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('');
$('#s7chips').innerHTML = parts('s7_chips').map(c => `<span class="chip">${esc(c)}</span>`).join('');
const [la, ld] = parts('s8_labels');
$('#s8ba').innerHTML = `<div class="bar2"><span class="lbl" style="color:var(--muted2)">${esc(la)}</span><span class="lbl" style="color:var(--mint)">${esc(ld)}</span></div>` +
  parts('s8_rows').map(r => { const [a, d] = r.split('>'); return `<div class="bar2 r"><div class="a">${esc(a)}</div><div class="d">${esc(d)}</div></div>`; }).join('');
$('#s9chain').innerHTML = parts('s9_flow').map(t => `<div class="card c">${esc(t)}</div>`).join('');
$('#s10steps').innerHTML = parts('s10_steps').map((s, i) => { const [t, d] = s.split(':'); return `<div class="card st"><span class="n">0${i + 1}</span><div><p class="t">${esc(t)}</p><p class="d">${esc(d)}</p></div></div>`; }).join('');
$('#s11w').innerHTML = parts('s11_words').map(t => `<span class="word">${esc(t)}</span>`).join('');

function fit() {
  if (RENDER) return;
  const s = Math.min(innerWidth / 1080, (innerHeight - 64) / 1920);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();
function fitLine(el, maxW = 920) { let fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > maxW && fs > 36) { fs -= 2; el.style.fontSize = fs + 'px'; } }
function fitBox(el, maxH, min = 36) { let fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollHeight > maxH && fs > min) { fs -= 2; el.style.fontSize = fs + 'px'; } }
function split(root) {
  [...root.childNodes].forEach(n => {
    if (n.nodeType === 3) {
      const f = document.createDocumentFragment();
      n.textContent.split(/(\s+)/).forEach(p => {
        if (!p) return;
        if (/^\s+$/.test(p)) { f.appendChild(document.createTextNode(' ')); return; }
        const w = document.createElement('span'); w.className = 'w';
        const i = document.createElement('span'); i.className = 'wi'; i.textContent = p;
        w.appendChild(i); f.appendChild(w);
      });
      n.replaceWith(f);
    } else if (n.nodeType === 1) split(n);
  });
}

const tl = gsap.timeline({ paused: true });
const typers = [];
function typeT(el, text, at, dur) { const p = { n: 0 }; typers.push({ el, text, p }); tl.to(p, { n: text.length, duration: dur, ease: 'none' }, at); }
function sync() { for (const t of typers) { const s = t.text.slice(0, Math.round(t.p.n)); if (t.el.textContent !== s) t.el.textContent = s; } }
const el = x => typeof x === 'string' ? $(x) : x;
const rd = x => { const n = el(x).textContent.trim().split(/\s+/).length; return Math.min(2.9, Math.max(1.3, .45 + n * .15)); };
function reveal(x, at, o = {}) {
  const w = el(x).querySelectorAll('.wi');
  tl.fromTo(w, { yPercent: 115, opacity: 0 }, { yPercent: 0, opacity: 1, duration: o.d || .8, ease: 'power3.out', stagger: o.s ?? .045 }, at);
  return at + .4 + w.length * (o.s ?? .045);
}
function revealLines(g, at, gap = .45) { let e = at; $$(g + ' .l').forEach((l, i) => { e = reveal(l, at + i * gap); }); return e; }
function hide(x, at, d = .45) { tl.to(x, { opacity: 0, y: -22, filter: 'blur(10px)', duration: d, ease: 'power2.in' }, at); }
function pop(x, at, o = {}) {
  tl.fromTo(x, { opacity: 0, y: o.y ?? 28, scale: o.sc ?? .96, filter: 'blur(8px)' },
    { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: o.d || .75, ease: o.e || 'power3.out', stagger: o.s || 0 }, at);
}
function sceneIn(id, at) { tl.set(id, { visibility: 'visible' }, at); tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: .35, ease: 'none' }, at); }
function sceneOut(id, at) { tl.to(id, { opacity: 0, scale: .97, filter: 'blur(12px)', duration: .55, ease: 'power2.in' }, at); tl.set(id, { visibility: 'hidden' }, at + .55); return at + .4; }
function blink(x, at, n, every = .4) { for (let k = 0; k < n; k++) tl.set(x, { opacity: k % 2 ? 1 : 0 }, at + k * every); }

function build() {
  $$('.nameL').forEach(e => fitLine(e, e.closest('.pair') ? 560 : 920));
  fitBox($('#s3br h3'), 140);
  $$('.h .l, .h.nameL .l').forEach(split);
  let t = 0, e;

  // ---------- 01 Continuidade ----------
  sceneIn('#s1', t);
  pop('#s1 .eyebrow', t + .1, { y: 10 });
  pop('#s1br', t + .3, { y: 40, d: .9 });
  if ($('#s1tag')) pop('#s1tag', t + 1.2, { y: 10, sc: .9 });
  e = revealLines('#s1g1', t + .6, .6);
  t = e + rd('#s1g1');
  hide('#s1g1', t);
  tl.to('#s1br', { opacity: .25, scale: .94, filter: 'blur(3px)', duration: .8 }, t);
  e = revealLines('#s1g2', t + .3, .7);
  t = sceneOut('#s1', e + rd('#s1g2'));
  // a partir daqui o fundo vai ficando mais limpo (o próprio vídeo "melhora")
  tl.to('.grid', { opacity: .12, duration: 40, ease: 'none' }, t);

  // ---------- 02 Busca ----------
  sceneIn('#s2', t);
  e = reveal('#s2g1 .l', t + .2);
  pop('#s2box', t + .3, { y: 20 });
  typeT($('#sq'), F.empresa, t + .9, Math.min(1.2, F.empresa.length * .05));
  blink('#s2caret', t + .3, 8);
  const ent = t + 2.0;
  tl.fromTo('#s2enter', { background: 'rgba(255,255,255,.08)' }, { background: 'rgba(126,240,201,.35)', duration: .15, yoyo: true, repeat: 1 }, ent);
  t = Math.max(e + rd('#s2g1') - .6, ent + .5);
  hide('#s2g1', t);
  e = reveal('#s2g2 .l', t + .3);
  $$('#s2list .li').forEach((li, i) => pop(li, e + .1 + i * .3, { y: 16, d: .5 }));
  t = sceneOut('#s2', e + .1 + 4 * .3 + 1);

  // ---------- 03 Primeira impressão ----------
  sceneIn('#s3', t);
  pop('#s3br', t + .2, { y: 50, d: 1 });
  pop('#s3br .hero > *', t + .7, { y: 18, s: .14, d: .6 });
  e = reveal('#s3g1 .l', t + .4);
  $$('#s3w .word').forEach((w, i) => pop(w, e + .2 + i * .25, { y: 14, sc: .85, e: 'back.out(1.8)', d: .5 }));
  t = e + .2 + 4 * .25 + .7;
  hide('#s3g1', t);
  e = reveal('#s3g2 .l', t + .3);
  t = sceneOut('#s3', e + rd('#s3g2'));

  // ---------- 04 Valor apresentado (quebra-cabeça → estrutura) ----------
  sceneIn('#s4', t);
  const secs = $$('#s4secs .sec');
  const scatter = [[-60, -40, -8], [70, 30, 7], [-30, 60, 5], [50, -50, -6], [-70, 20, 9], [40, 70, -7]];
  secs.forEach((s, i) => tl.fromTo(s, { opacity: 0, x: scatter[i][0] * 2, y: scatter[i][1] * 2, rotate: scatter[i][2] * 2 },
    { opacity: .4, x: scatter[i][0], y: scatter[i][1], rotate: scatter[i][2], duration: .8, ease: 'power3.out' }, t + .3 + i * .08));
  e = reveal('#s4g1 .l', t + .2);
  t = e + rd('#s4g1');
  hide('#s4g1', t);
  e = reveal('#s4g2 .l', t + .3);
  tl.to(secs, { opacity: 1, x: 0, y: 0, rotate: 0, borderLeftColor: getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#2563E0', duration: .9, ease: 'power3.inOut', stagger: .06 }, t + .5);
  t = e + rd('#s4g2');
  hide('#s4g2', t);
  e = reveal('#s4g3 .l', t + .3);
  t = sceneOut('#s4', e + rd('#s4g3'));

  // ---------- 05 Cada parte responde uma pergunta ----------
  sceneIn('#s5', t);
  pop('#s5 .page', t + .2, { y: 40 });
  e = reveal('#s5g1 .l', t + .3);
  const pqs = $$('#s5track .pq');
  const step = 272;
  pqs.forEach((p, i) => {
    const at = e + .1 + i * .6;
    if (i > 1) tl.to('#s5track', { y: -(i - 1) * step, duration: .7, ease: 'power2.inOut' }, at - .1);
    tl.to(p, { borderColor: 'rgba(126,240,201,.6)', background: '#0E1B3A', duration: .35 }, at);
    if (i) tl.to(pqs[i - 1], { borderColor: '#243049', background: '#111829', duration: .35 }, at);
  });
  t = e + .1 + pqs.length * .6 + .1;
  hide('#s5g1', t);
  e = reveal('#s5g2 .l', t + .3);
  t = sceneOut('#s5', e + rd('#s5g2'));

  // ---------- 06 Jornada ----------
  sceneIn('#s6', t);
  pop('#s6flow > *', t + .2, { y: 18, s: .15, d: .5 });
  e = reveal('#s6g1 .l', t + .2 + 7 * .15 + .1);
  t = sceneOut('#s6', e + rd('#s6g1'));

  // ---------- 07 Buscadores e IA ----------
  sceneIn('#s7', t);
  e = reveal('#s7g1 .l', t + .2);
  pop('#s7data', t + .5, { y: 30 });
  pop('#s7data .row', t + .9, { y: 10, s: .3, d: .5 });
  pop('#s7chips .chip', t + 1 + dataRows.length * .3, { y: 12, s: .18, d: .5 });
  t = Math.max(e + rd('#s7g1'), t + 1.6 + dataRows.length * .3);
  hide('#s7g1', t);
  e = reveal('#s7g2 .l', t + .3);
  t = sceneOut('#s7', e + rd('#s7g2'));

  // ---------- 08 Antes / Depois → "Esse é o ponto" ----------
  sceneIn('#s8', t);
  pop('#s8ba .bar2:first-child', t + .2, { y: 10 });
  $$('#s8ba .r').forEach((r, i) => {
    pop(r.querySelector('.a'), t + .4 + i * 1.05, { y: 16, d: .5 });
    pop(r.querySelector('.d'), t + .85 + i * 1.05, { y: 16, d: .55 });
  });
  t = t + .85 + 3 * 1.05 + .9;
  tl.to('#s8ba', { opacity: 0, y: -30, filter: 'blur(10px)', duration: .6 }, t);
  tl.to('.grid', { opacity: 0, duration: 1.2 }, t);
  e = reveal('#s8a .l', t + .6, { d: 1 });
  t = e + .8;
  hide('#s8a', t);
  e = reveal('#s8b .l', t + .4);
  t = e + rd('#s8b');
  hide('#s8b', t);
  e = reveal('#s8c .l', t + .4, { d: 1, s: .07 });
  t = sceneOut('#s8', e + rd('#s8c') + .6);

  // ---------- 09 Entra a HZK ----------
  sceneIn('#s9', t);
  pop('#s9logo', t + .2, { sc: .85, y: 0, d: 1 });
  e = revealLines('#s9g1', t + .6, .7);
  $$('#s9chain .c').forEach((c, i) => pop(c, e + .2 + i * .15, { y: 14, d: .45 }));
  t = Math.max(e + rd('#s9g1'), e + .2 + 6 * .15 + .4);
  hide('#s9g1', t);
  e = reveal('#s9g2 .l', t + .3);
  t = sceneOut('#s9', e + rd('#s9g2'));

  // ---------- 10 Processo ----------
  sceneIn('#s10', t);
  $$('#s10steps .st').forEach((s, i) => pop(s, t + .2 + i * .3, { y: 24, d: .55 }));
  e = reveal('#s10g1 .l', t + .2 + 4 * .3 + .1);
  t = sceneOut('#s10', e + rd('#s10g1'));

  // ---------- 11 Projeção (mais espaço, mais calma) ----------
  sceneIn('#s11', t);
  e = reveal('#s11g1 .l', t + .3, { d: 1 });
  tl.fromTo('#s11name', { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 1.4, ease: 'power2.out' }, t + .6);
  t = e + rd('#s11g1');
  hide('#s11g1', t);
  e = reveal('#s11g2 .l', t + .3);
  $$('#s11w .word').forEach((w, i) => pop(w, e + .2 + i * .32, { y: 10, d: .6 }));
  t = sceneOut('#s11', e + .2 + 4 * .32 + 1);

  // ---------- 12 Fechamento ----------
  sceneIn('#s12', t);
  e = revealLines('#s12g1', t + .3, .7);
  t = e + rd('#s12g1');
  hide('#s12g1', t);
  pop('#s12meet', t + .4, { sc: .92, y: 30, d: .9 });
  pop('#s12meet .pair > *', t + .8, { y: 12, s: .2, d: .6 });
  pop('#s12meet .cta2', t + 1.5, { y: 12 });
  pop('#s12meet .pill', t + 2.1, { y: 10, sc: .85, e: 'back.out(2)', d: .6 });
  t = t + 2.1 + 2.3;
  tl.to('#stage', { opacity: 0, duration: .8 }, t - .8);
  tl.to({}, { duration: .01 }, t);
}

function startPreview() {
  gsap.ticker.add(sync);
  const btn = $('#play'), sc = $('#scrub'), tm = $('#time'), D = tl.duration();
  tl.eventCallback('onUpdate', () => { sc.value = tl.progress() * 1000; tm.textContent = tl.time().toFixed(1) + ' / ' + D.toFixed(1); });
  btn.onclick = () => { if (tl.paused()) { tl.play(); btn.textContent = 'Pausar'; } else { tl.pause(); btn.textContent = 'Play'; } };
  sc.oninput = () => { tl.pause(); btn.textContent = 'Play'; tl.progress(sc.value / 1000); sync(); };
  tl.play();
}

const fonts = Promise.all(['600 80px Sora', '700 80px Sora', '400 30px Inter', '500 30px Inter', '600 30px Inter'].map(f => document.fonts.load(f))).then(() => document.fonts.ready);
const imgs = Promise.all($$('img').filter(i => i.getAttribute('src')).map(i => i.decode().catch(() => {})));
Promise.race([Promise.all([fonts, imgs]), new Promise(r => setTimeout(r, 10000))]).then(() => {
  build();
  window.__duration = tl.duration();
  window.__seek = t => { tl.time(t, false); sync(); };
  window.__ready = true;
  if (!RENDER) startPreview();
});
</script>
</body>
