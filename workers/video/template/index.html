<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análise de presença digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
:root{
  --bg:#05070c; --text:#f2f4f8; --muted:#8b93a7;
  --accent:#79a3ff; --accent2:#7ef0c9; --warn:#ff8a70; --blue:#2563E0;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:calc(50% - 32px);width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:center center}
body.render #stage{left:0;top:0;transform:none!important}

.bg{position:absolute;inset:0;overflow:hidden}
.grid{position:absolute;inset:-10%;opacity:.4;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:84px 84px;-webkit-mask-image:radial-gradient(ellipse at center,#000 15%,transparent 68%);mask-image:radial-gradient(ellipse at center,#000 15%,transparent 68%)}
.orb{position:absolute;border-radius:50%}
.orb1{width:1400px;height:1400px;left:-600px;top:-700px;background:radial-gradient(circle,rgba(56,96,255,.32),transparent 62%)}
.orb2{width:1200px;height:1200px;right:-500px;bottom:-600px;background:radial-gradient(circle,rgba(40,200,160,.2),transparent 62%)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65))}

.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:72px;padding:150px 80px;visibility:hidden;opacity:0}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:72px;padding:inherit}
.hwrap{display:grid;place-items:center;width:100%}
.hwrap>*{grid-area:1/1}
.h{font-family:'Sora',sans-serif;font-weight:600;font-size:76px;line-height:1.1;letter-spacing:-.035em;text-align:center;width:100%}
.h.sm{font-size:60px}
.h.xl{font-size:92px}
.l{display:block}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .16em;margin-bottom:-.16em}
.wi{display:inline-block}
.accent{color:var(--accent)} .mint{color:var(--accent2)} .muted{color:var(--muted)}
.grad .wi{background:linear-gradient(90deg,#8fb2ff,#7ef0c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.nameL{white-space:nowrap}
.lbl{font-size:24px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2);text-align:center}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

.browser{width:920px;border-radius:24px;background:#0b1019;border:1px solid var(--line2);overflow:hidden;box-shadow:0 40px 100px -30px rgba(0,0,0,.85);flex:none}
.bbar{height:50px;display:flex;align-items:center;gap:9px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
.bbar i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.16)}
.bbar span{margin-left:14px;font-size:20px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:680px}
.view{position:relative;overflow:hidden;background:#fff}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.canvas img{display:block}
.hl{position:absolute;border:3px solid var(--accent2);border-radius:12px;box-shadow:0 0 40px rgba(126,240,201,.55),0 0 0 6000px rgba(5,7,12,.68);opacity:0}

.cmp{display:flex;gap:22px;width:920px}
.cc{position:relative;flex:1;border-radius:28px;background:rgba(255,255,255,.035);border:1px solid var(--line);padding:32px 30px;display:flex;flex-direction:column;gap:20px}
.cc h4{font-size:20px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tg{display:flex;align-items:flex-start;gap:14px;font-size:28px;font-weight:500;line-height:1.3;color:#d3d9e6}
.tg .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;margin-top:-1px}
.ok{background:rgba(126,240,201,.14);color:var(--accent2)}
.bad{background:rgba(255,138,112,.14);color:var(--warn)}

.chat{width:920px;border-radius:32px;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:40px;display:flex;flex-direction:column;gap:22px}
.msg{display:flex;gap:16px;align-items:flex-end}
.msg.user{justify-content:flex-end}
.bubble{font-size:38px;line-height:1.3;padding:22px 32px;border-radius:30px}
.msg.user .bubble{background:linear-gradient(135deg,#3b66e0,#5b8cff);color:#fff;border-bottom-right-radius:8px;font-weight:500}
.msg.site .bubble{background:rgba(255,255,255,.05);border:1px solid var(--line);border-bottom-left-radius:8px}
.av{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.08);color:var(--muted)}
.dots{display:flex;gap:10px;align-items:center;height:42px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.who{font-size:20px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;text-align:right}

.search{width:920px;height:104px;border-radius:52px;display:flex;align-items:center;gap:20px;padding:0 24px;font-size:32px;border:1.5px solid transparent;
  background:linear-gradient(#0b0f19,#0b0f19) padding-box,linear-gradient(90deg,#6f9cff,#7ef0c9,#b18cff) border-box;box-shadow:0 0 70px -12px rgba(111,156,255,.55)}
.spark{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6f9cff,#7ef0c9);color:#05070c;font-size:30px}
.qs{display:grid;white-space:nowrap;overflow:hidden}.qs>*{grid-area:1/1}
.caret{flex:none;width:3px;height:40px;background:var(--accent);margin-left:-14px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:920px}
.chip{padding:26px 30px;border-radius:22px;background:rgba(14,19,30,.9);border:1px solid var(--line2);font-size:32px;font-weight:500;display:flex;align-items:center;gap:16px}
.chip::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--accent)}

.cbody{padding:36px;display:flex;flex-direction:column;gap:22px}
.cnav{display:flex;justify-content:space-between;align-items:center}
.cnav b{font-family:Sora;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px}
.cnav b img{height:40px;max-width:120px;object-fit:contain}
.cnav span{display:flex;gap:14px}.cnav span i{width:64px;height:10px;border-radius:5px;background:rgba(255,255,255,.12)}
.ctag{font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cesp{font-family:Sora;font-size:58px;font-weight:600;line-height:1.08;letter-spacing:-.03em}
.cdif{align-self:flex-start;padding:14px 26px;border-radius:999px;background:var(--accent2);color:#04130d;font-size:26px;font-weight:600}
.cbad{display:flex;gap:14px}
.cbad span{display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;border:1px solid var(--line2);font-size:24px;font-weight:500}
.cbad svg{color:var(--accent2);font-size:22px}
.ccta{align-self:flex-start;padding:16px 30px;border-radius:14px;background:var(--blue);font-size:24px;font-weight:600}
.ccards{display:flex;gap:14px}.ccards div{flex:1;height:120px;border-radius:14px;background:rgba(255,255,255,.05)}
.sub{font-size:34px;line-height:1.4;color:var(--muted);text-align:center}

.rings{position:absolute;left:50%;top:50%;width:0;height:0}
.ring{position:absolute;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;border:1.5px solid rgba(121,163,255,.55);opacity:0}
.idmark img{height:170px;max-width:620px;object-fit:contain;display:block}
.meet{display:flex;flex-direction:column;align-items:center;gap:36px;padding:70px 60px;width:920px;border-radius:44px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--line2);box-shadow:0 0 160px -30px rgba(111,156,255,.45)}
.sig{position:absolute;bottom:150px;left:0;right:0;display:flex;justify-content:center}
.sig img{height:72px}

#ctrl{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#0b0e15;border-top:1px solid #1c2230;font:500 14px Inter,sans-serif;color:#cfd5e2}
#ctrl button{background:#1b2232;color:#e8ecf4;border:1px solid #2a3346;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
#ctrl input{flex:1;accent-color:#79a3ff}
#ctrl .t{font-variant-numeric:tabular-nums;min-width:110px}
body.render #ctrl{display:none}
</style>
<script>
  // dados da empresa: index.html?d=empresas/<pasta>
  (function () {
    const d = new URLSearchParams(location.search).get('d') || 'empresas/exemplo';
    document.write('<script src="' + d + '/dados.js"><\/script>');
  })();
</script>
</head>
<body>
<div id="stage">
  <div class="bg"><div class="grid"></div><div class="orb orb1"></div><div class="orb orb2"></div><div class="vignette"></div></div>

  <!-- 01 Reconhecimento -->
  <section class="scene" id="s1">
    <p class="lbl" data-t="s1_label"></p>
    <div class="hwrap">
      <div class="h" id="s1g1"><span class="l grad nameL" id="s1name" data-f="empresa"></span><span class="l" data-t="s1_b"></span></div>
      <div class="h sm" id="s1g2"><span class="l" data-t="s1_c"></span></div>
    </div>
    <div class="browser" id="s1br"><div class="bbar"><i></i><i></i><i></i><span data-f="url"></span></div>
      <div class="view" style="height:575px"><div class="canvas"><img data-src="home"></div></div></div>
  </section>

  <!-- 02 Incongruência -->
  <section class="scene" id="s2">
    <div class="hwrap">
      <div class="h xl" id="s2g1"><span class="l" data-t="s2_a"></span></div>
      <div class="h" id="s2g2"><span class="l" data-t="s2_c1"></span><span class="l" data-t="s2_c2"></span></div>
    </div>
    <div class="cmp">
      <div class="cc" id="s2A"><h4 data-t="s2_A"></h4>
        <div class="tg"><span class="ic ok"><i data-i="check"></i></span>Experiência</div>
        <div class="tg"><span class="ic ok"><i data-i="check"></i></span>Estrutura</div>
        <div class="tg" id="s2dif"><span class="ic ok"><i data-i="check"></i></span><span data-f="diferencial"></span></div>
      </div>
      <div class="cc" id="s2B"><h4 data-t="s2_B"></h4>
        <div class="tg"><span class="ic bad"><i data-i="alert"></i></span><span data-f="problema1.curto"></span></div>
        <div class="tg" id="s2p2"><span class="ic bad"><i data-i="alert"></i></span><span data-f="problema2.curto"></span></div>
      </div>
    </div>
  </section>

  <!-- 03 / 04 Evidências -->
  <section class="scene" id="s3">
    <p class="lbl"><span data-t="s3_label"></span> · 01</p>
    <div class="hwrap">
      <div class="h sm" id="s3g1"><span class="l" data-t="s3_b"></span></div>
      <div class="h sm" id="s3g2"><span class="l" data-t="s3_c"></span></div>
    </div>
    <div class="browser"><div class="bbar"><i></i><i></i><i></i><span data-f="url"></span></div>
      <div class="view" style="height:700px"><div class="canvas"><img data-src="problema1.print"><div class="hl"></div></div></div></div>
  </section>
  <section class="scene" id="s4">
    <p class="lbl"><span data-t="s3_label"></span> · 02</p>
    <div class="hwrap">
      <div class="h sm" id="s4g1"><span class="l" data-t="s4_b"></span></div>
      <div class="h sm" id="s4g2"><span class="l" data-t="s4_c"></span></div>
    </div>
    <div class="browser"><div class="bbar"><i></i><i></i><i></i><span data-f="url"></span></div>
      <div class="view" style="height:700px"><div class="canvas"><img data-src="problema2.print"><div class="hl"></div></div></div></div>
  </section>

  <!-- 05 Comparação -->
  <section class="scene" id="s5">
    <div class="hwrap">
      <div class="h sm" id="s5g1"><span class="l" data-t="s5_a"></span></div>
      <div class="h sm" id="s5g2"><span class="l" data-t="s5_c"></span></div>
    </div>
    <div class="chat" id="s5chat">
      <p class="who">Quem chegou agora</p>
      <div class="msg user"><div class="bubble" data-t="s5_q1"></div></div>
      <div class="msg user"><div class="bubble" data-t="s5_q2"></div></div>
      <div class="msg user"><div class="bubble" data-t="s5_q3"></div></div>
      <div class="msg site" id="s5site"><span class="av"><i data-i="globe"></i></span><div class="bubble"><div class="dots"><i></i><i></i><i></i></div></div></div>
    </div>
  </section>

  <!-- 06 Busca e IA -->
  <section class="scene" id="s6">
    <div class="hwrap">
      <div class="h xl" id="s6g1"><span class="l" data-t="s6_a"></span></div>
      <div class="h sm" id="s6g2"><span class="l" data-t="s6_c"></span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:36px;align-items:center">
      <div class="search" id="s6box"><span class="spark"><i data-i="spark"></i></span><span class="qs"><span id="sq1"></span><span id="sq2"></span></span><span class="caret" id="s6caret"></span></div>
      <div class="chips" id="s6chips"></div>
    </div>
  </section>

  <!-- 07 Virada -->
  <section class="scene" id="s7">
    <div class="pane"><div class="h xl" id="s7g1"><span class="l" data-t="s7_a"></span></div></div>
    <div class="pane"><div class="h" id="s7g2"><span class="l" data-t="s7_b"></span></div></div>
  </section>

  <!-- 08 Estado desejado -->
  <section class="scene" id="s8">
    <div class="h xl" id="s8g1"><span class="l" data-t="s8_a"></span></div>
    <div class="browser" id="s8br"><div class="bbar"><i></i><i></i><i></i><span data-f="url"></span></div>
      <div class="cbody">
        <div class="cnav"><b><img id="s8logo" alt=""><span data-f="empresa"></span></b><span><i></i><i></i><i></i></span></div>
        <p class="ctag" data-f="cidade"></p>
        <p class="cesp" id="s8esp" data-f="especialidade"></p>
        <p class="cdif" id="s8dif" data-f="diferencial"></p>
        <div class="cbad" id="s8bad"></div>
        <p class="ccta" id="s8cta" data-t="s8_cta"></p>
        <div class="ccards" id="s8cc"><div></div><div></div><div></div></div>
      </div>
    </div>
    <p class="sub" id="s8sub" data-t="s8_b"></p>
  </section>

  <!-- 09 Identidade -->
  <section class="scene" id="s9">
    <div class="rings"><span class="ring"></span><span class="ring"></span><span class="ring"></span></div>
    <div class="idmark" id="s9mark"></div>
    <div class="hwrap">
      <div class="h" id="s9g1"><span class="l muted" data-t="s9_a"></span></div>
      <div class="h" id="s9g2"><span class="l" data-t="s9_b"></span></div>
    </div>
  </section>

  <!-- 10 Fechamento -->
  <section class="scene" id="s10">
    <div class="pane"><div class="h xl" id="s10g1"><span class="l" data-t="s10_a"></span></div></div>
    <div class="pane"><div class="meet" id="s10meet"><div class="idmark" id="s10mark"></div><div class="h" id="s10g2"><span class="l" data-t="s10_b"></span></div></div></div>
    <div class="sig" id="sig"><img id="sigLogo" alt=""></div>
  </section>
</div>

<div id="ctrl"><button id="play">Pausar</button><span class="t" id="time">0.0</span><input type="range" id="scrub" min="0" max="1000" value="0"></div>

<script src="gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const F = window.FICHA, C = window.CONFIG, TX = F.textos;
const get = k => k.split('.').reduce((o, p) => o && o[p], F);
const stage = $('#stage');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// *texto* no roteiro = destaque em verde
const rich = s => esc(s).replace(/\*(.+?)\*/g, '<span class="mint">$1</span>');

const ICONS = {
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>', alert: '<path d="M12 7v6.5M12 17v.01"/>',
  spark: '<path d="M12 2.5l2.1 6.4 6.4 2.1-6.4 2.1L12 19.5l-2.1-6.4L3.5 11l6.4-2.1z" fill="currentColor" stroke="none"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/>'
};
// ---------- ficha → DOM (nada personalizado fica escrito no HTML) ----------
$$('[data-f]').forEach(e => e.textContent = get(e.dataset.f) || '');
$$('[data-t]').forEach(e => e.innerHTML = rich(TX[e.dataset.t] || ''));
// campos opcionais: sem diferencial / sem 2º problema / sem cidade, a cena se adapta
if (!F.diferencial) { $('#s2dif').remove(); $('#s8dif').remove(); }
if (!F.problema2) { $('#s2p2').remove(); $('#s4').remove(); }
if (!F.cidade) $$('[data-f="cidade"]').forEach(e => e.remove());
$$('[data-src]').forEach(e => e.src = get(e.dataset.src));
$('#s6chips').innerHTML = TX.s6_chips.split('|').map(c => `<div class="chip">${esc(c)}</div>`).join('');
$('#s8bad').innerHTML = TX.s8_badges.split('|').map(c => `<span><i data-i="check"></i>${esc(c)}</span>`).join('');
$$('[data-i]').forEach(e => e.outerHTML = `<svg class="i" viewBox="0 0 24 24">${ICONS[e.dataset.i]}</svg>`);
if (F.logo) $('#s8logo').src = F.logo; else $('#s8logo').remove();
for (const id of ['#s9mark', '#s10mark'])
  $(id).innerHTML = F.logo ? `<img src="${F.logo}" alt="">` : `<div class="h xl"><span class="l grad nameL">${esc(F.empresa)}</span></div>`;
if (C.assinatura_logo) $('#sigLogo').src = C.assinatura_logo; else $('#sig').remove();

function fit() {
  if (RENDER) return;
  const s = Math.min(innerWidth / 1080, (innerHeight - 64) / 1920);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

// nome longo numa linha só / texto longo num espaço: reduz a fonte até caber
function fitLine(el, maxW = 920) { let fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > maxW && fs > 40) { fs -= 2; el.style.fontSize = fs + 'px'; } }
function fitBox(el, maxH, min = 40) { let fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollHeight > maxH && fs > min) { fs -= 2; el.style.fontSize = fs + 'px'; } }

function split(root) {
  [...root.childNodes].forEach(n => {
    if (n.nodeType === 3) {
      const f = document.createDocumentFragment();
      n.textContent.split(/(\s+)/).forEach(p => {
        if (!p) return;
        if (/^\s+$/.test(p)) { f.appendChild(document.createTextNode(' ')); return; }
        const w = document.createElement('span'); w.className = 'w';
        const i = document.createElement('span'); i.className = 'wi'; i.textContent = p;
        w.appendChild(i); f.appendChild(w);
      });
      n.replaceWith(f);
    } else if (n.nodeType === 1) split(n);
  });
}

const tl = gsap.timeline({ paused: true });
const typers = [];
function typeT(el, text, at, dur) { const p = { n: 0 }; typers.push({ el, text, p }); tl.to(p, { n: text.length, duration: dur, ease: 'none' }, at); }
function sync() { for (const t of typers) { const s = t.text.slice(0, Math.round(t.p.n)); if (t.el.textContent !== s) t.el.textContent = s; } }
const el = x => typeof x === 'string' ? $(x) : x;
// tempo de leitura do texto que está na tela
const rd = x => { const n = el(x).textContent.trim().split(/\s+/).length; return Math.min(3.8, Math.max(1.7, .8 + n * .2)); };
function reveal(x, at, o = {}) {
  const w = el(x).querySelectorAll('.wi');
  tl.fromTo(w, { yPercent: 115, opacity: 0 }, { yPercent: 0, opacity: 1, duration: o.d || .8, ease: 'power3.out', stagger: o.s ?? .05 }, at);
  return at + .4 + w.length * (o.s ?? .05);
}
function revealLines(g, at, gap = .5) { let e = at; $$(g + ' .l').forEach((l, i) => { e = reveal(l, at + i * gap); }); return e; }
function hide(x, at, d = .5) { tl.to(x, { opacity: 0, y: -24, filter: 'blur(10px)', duration: d, ease: 'power2.in' }, at); }
function pop(x, at, o = {}) {
  tl.fromTo(x, { opacity: 0, y: o.y ?? 30, scale: o.sc ?? .96, filter: 'blur(8px)' },
    { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: o.d || .8, ease: o.e || 'power3.out', stagger: o.s || 0 }, at);
}
function sceneIn(id, at) { tl.set(id, { visibility: 'visible' }, at); tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: .35, ease: 'none' }, at); }
function sceneOut(id, at) { tl.to(id, { opacity: 0, scale: .97, filter: 'blur(12px)', duration: .6, ease: 'power2.in' }, at); tl.set(id, { visibility: 'hidden' }, at + .6); return at + .45; }
function blink(x, at, n, every = .42) { for (let k = 0; k < n; k++) tl.set(x, { opacity: k % 2 ? 1 : 0 }, at + k * every); }

// enquadra o print: visão geral (a) e zoom no ponto observado (b)
function shot(scene, foco) {
  const view = $(scene + ' .view'), cv = $(scene + ' .canvas'), img = cv.querySelector('img'), hl = cv.querySelector('.hl');
  const vw = view.clientWidth, vh = view.clientHeight, iw = img.naturalWidth, ih = img.naturalHeight;
  gsap.set(cv, { width: iw, height: ih });
  const f = foco ? { x: foco[0], y: foco[1], w: foco[2], h: foco[3] } : { x: 0, y: 0, w: iw, h: Math.min(ih, iw * vh / vw) };
  const pos = (s, cx, cy) => ({
    scale: s,
    x: iw * s <= vw ? (vw - iw * s) / 2 : Math.min(0, Math.max(vw - iw * s, vw / 2 - cx * s)),
    y: ih * s <= vh ? (vh - ih * s) / 2 : Math.min(0, Math.max(vh - ih * s, vh / 2 - cy * s))
  });
  const s0 = vw / iw, s1 = Math.max(s0, Math.min(vw * .88 / f.w, vh * .7 / f.h, 1.7));
  if (hl) gsap.set(hl, { left: f.x, top: f.y, width: f.w, height: f.h, borderWidth: 3 / s1, borderRadius: 12 / s1 });
  return { cv, hl, a: pos(s0, f.x + f.w / 2, f.y + f.h / 2), b: pos(s1, f.x + f.w / 2, f.y + f.h / 2) };
}

function build() {
  fitLine($('#s1name'));
  $$('#s9mark .nameL, #s10mark .nameL').forEach(e => fitLine(e));
  ['#s3g1', '#s4g1'].filter(s => $(s)).forEach(s => fitBox($(s), 340));
  fitBox($('#s8esp'), 140, 40);
  $$('.h .l').forEach(split);
  let t = 0, e;

  tl.to('.orb1', { x: 400, y: 300, duration: 90, ease: 'sine.inOut' }, 0);
  tl.to('.orb2', { x: -350, y: -260, duration: 90, ease: 'sine.inOut' }, 0);
  tl.to('.grid', { backgroundPosition: '0px 168px', duration: 90, ease: 'none' }, 0);

  // 01 Reconhecimento
  sceneIn('#s1', t);
  pop('#s1 .lbl', t + .2, { y: 10 });
  pop('#s1br', t + .5, { y: 40, d: 1 });
  const h1 = shot('#s1', null); gsap.set(h1.cv, h1.a);
  e = revealLines('#s1g1', t + .9, .7);
  t = e + rd('#s1g1');
  hide('#s1g1', t);
  tl.to('#s1br .view', { filter: 'saturate(.35) brightness(.6)', duration: 1 }, t);
  e = reveal('#s1g2 .l', t + .35);
  t = sceneOut('#s1', e + rd('#s1g2'));

  // 02 Incongruência
  sceneIn('#s2', t);
  e = reveal('#s2g1 .l', t + .2);
  pop('#s2A', e + .5, { y: 40 });
  pop('#s2A .tg', e + .8, { y: 14, s: .18, d: .55 });
  pop('#s2B', e + 1.6, { y: 40 });
  pop('#s2B .tg', e + 1.9, { y: 14, s: .25, d: .55 });
  t = e + 3.6;
  hide('#s2g1', t);
  tl.to('#s2A', { borderColor: 'rgba(126,240,201,.55)', boxShadow: '0 30px 90px -30px rgba(126,240,201,.4)', duration: .6 }, t);
  tl.to('#s2B', { opacity: .55, duration: .6 }, t);
  e = revealLines('#s2g2', t + .3, .8);
  t = sceneOut('#s2', e + rd('#s2g2'));

  // 03 / 04 Evidências reais
  ['s3', 's4'].filter((id, n) => F['problema' + (n + 1)]).forEach((id, n) => {
    const sh = shot('#' + id, F['problema' + (n + 1)].foco); gsap.set(sh.cv, sh.a);
    sceneIn('#' + id, t);
    pop(`#${id} .lbl`, t + .15, { y: 10 });
    pop(`#${id} .browser`, t + .3, { y: 40, d: 1 });
    tl.to(sh.cv, { ...sh.b, duration: 1.3, ease: 'power3.inOut' }, t + .8);
    tl.to(sh.hl, { opacity: 1, duration: .7 }, t + 1.6);
    e = reveal(`#${id}g1 .l`, t + 1.7);
    t = e + rd(`#${id}g1`);
    hide(`#${id}g1`, t);
    e = reveal(`#${id}g2 .l`, t + .35);
    t = sceneOut('#' + id, e + rd(`#${id}g2`));
  });

  // 05 O momento da comparação
  sceneIn('#s5', t);
  e = reveal('#s5g1 .l', t + .2);
  pop('#s5chat', t + .4, { y: 40 });
  pop('#s5 .who', t + .6, { y: 8 });
  const ub = $$('#s5 .msg.user');
  ub.forEach((m, i) => pop(m, e + .4 + i * .9, { y: 20, sc: .9, e: 'back.out(1.6)', d: .6 }));
  const sa = e + .4 + ub.length * .9 + .2;
  pop('#s5site', sa, { y: 20, d: .5 });
  tl.to('#s5site .dots i', { y: -9, duration: .24, yoyo: true, repeat: 9, stagger: .12, ease: 'sine.inOut' }, sa + .2);
  t = sa + 1.1;
  hide('#s5g1', t);
  tl.to('#s5 .msg.user', { opacity: .4, duration: .6 }, t);
  e = reveal('#s5g2 .l', t + .35);
  t = sceneOut('#s5', e + rd('#s5g2'));

  // 06 Busca e IA
  sceneIn('#s6', t);
  e = reveal('#s6g1 .l', t + .2);
  pop('#s6box', t + .4, { y: 24 });
  const q1 = TX.s6_q1, q2 = TX.s6_q2;
  typeT($('#sq1'), q1, t + .9, Math.min(1.3, q1.length * .04));
  const tq2 = t + 2.6;
  tl.set('#sq1', { opacity: 0 }, tq2);
  typeT($('#sq2'), q2, tq2 + .05, Math.min(1.4, q2.length * .04));
  blink('#s6caret', t + .4, 16);
  pop('#s6chips .chip', tq2 + 1.5, { y: 20, s: .25, d: .6 });
  t = tq2 + 2.7;
  hide('#s6g1', t);
  e = reveal('#s6g2 .l', t + .35);
  t = sceneOut('#s6', e + rd('#s6g2') + .3);

  // 07 A virada
  sceneIn('#s7', t);
  e = reveal('#s7g1 .l', t + .3, { d: 1 });
  t = e + rd('#s7g1');
  hide('#s7g1', t);
  e = reveal('#s7g2 .l', t + .4, { d: 1, s: .07 });
  t = sceneOut('#s7', e + rd('#s7g2') + .6);

  // 08 Estado desejado
  sceneIn('#s8', t);
  e = reveal('#s8g1 .l', t + .2);
  pop('#s8br', e + .2, { y: 50, d: 1.1 });
  pop('#s8br .cnav, #s8br .ctag', e + .6, { y: 10, s: .15 });
  pop('#s8esp', e + 1.1, { y: 20, d: .9 });
  if ($('#s8dif')) tl.fromTo('#s8dif', { opacity: 0, scale: .85 }, { opacity: 1, scale: 1, duration: .6, ease: 'back.out(2)' }, e + 1.9);
  pop('#s8bad span', e + 2.4, { y: 12, s: .25, d: .5 });
  pop('#s8cta, #s8cc', e + 3.0, { y: 14, s: .15, d: .6 });
  tl.to('#s8br', { borderColor: 'rgba(126,240,201,.5)', boxShadow: '0 0 140px -20px rgba(126,240,201,.35)', duration: .8 }, e + 2.4);
  pop('#s8sub', e + 3.4, { y: 12 });
  t = sceneOut('#s8', e + 3.4 + rd('#s8sub') + .6);

  // 09 Identidade
  sceneIn('#s9', t);
  tl.fromTo('#s9 .ring', { scale: .2, opacity: .8 }, { scale: 2.8, opacity: 0, duration: 2.6, stagger: .55, ease: 'power1.out' }, t + .2);
  pop('#s9mark', t + .3, { sc: 1.08, y: 0, d: 1.1 });
  e = reveal('#s9g1 .l', t + .9);
  t = e + rd('#s9g1');
  hide('#s9g1', t);
  e = reveal('#s9g2 .l', t + .4, { d: 1, s: .06 });
  t = sceneOut('#s9', e + rd('#s9g2') + .5);

  // 10 Fechamento
  sceneIn('#s10', t);
  e = reveal('#s10g1 .l', t + .3, { d: 1 });
  t = e + rd('#s10g1');
  hide('#s10g1', t);
  pop('#s10meet', t + .4, { sc: .92, y: 30, d: .9 });
  pop('#s10mark', t + .7, { y: 10, d: .8 });
  e = reveal('#s10g2 .l', t + 1.1, { d: 1 });
  pop('#sig', e + .3, { y: 14 });
  t = e + 3.6;
  tl.to('#stage', { opacity: 0, duration: .8 }, t - .8);
  tl.to({}, { duration: .01 }, t);
}

function startPreview() {
  gsap.ticker.add(sync);
  const btn = $('#play'), sc = $('#scrub'), tm = $('#time'), D = tl.duration();
  tl.eventCallback('onUpdate', () => { sc.value = tl.progress() * 1000; tm.textContent = tl.time().toFixed(1) + ' / ' + D.toFixed(1); });
  tl.eventCallback('onComplete', () => btn.textContent = 'Repetir');
  btn.onclick = () => {
    if (tl.progress() >= 1) { tl.restart(); btn.textContent = 'Pausar'; }
    else if (tl.paused()) { tl.play(); btn.textContent = 'Pausar'; }
    else { tl.pause(); btn.textContent = 'Play'; }
  };
  sc.oninput = () => { tl.pause(); btn.textContent = 'Play'; tl.progress(sc.value / 1000); sync(); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); } });
  tl.play();
}

const fonts = Promise.all(['600 80px Sora', '700 80px Sora', '400 30px Inter', '500 30px Inter', '600 30px Inter'].map(f => document.fonts.load(f))).then(() => document.fonts.ready);
const imgs = Promise.all($$('img').filter(i => i.getAttribute('src')).map(i => i.decode().catch(() => {})));
Promise.race([Promise.all([fonts, imgs]), new Promise(r => setTimeout(r, 10000))]).then(() => {
  build();
  window.__duration = tl.duration();
  window.__seek = t => { tl.time(t, false); sync(); };
  window.__ready = true;
  if (!RENDER) startPreview();
});
</script>
