<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --navy: #1b2432; --orange: #ea5b25; --orange-press: #d24e1c;
        --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --text-2: #6e6e73; --sep: rgba(27, 36, 50, .1); --fill: rgba(27, 36, 50, .06);
        --ok: #1f7a3a; --err: #d70015;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #12171f; --card: #1c232e; --text: #f5f5f7; --text-2: #a1a1a6; --sep: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .07); --orange: #f06a36; --orange-press: #ff7a45; --ok: #4cd964; --err: #ff453a; }
      }
      body { width: 320px; margin: 0; padding: 16px; background: var(--bg); color: var(--text);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      header img { width: 32px; height: 32px; }
      h1 { font-size: 16px; font-weight: 650; letter-spacing: -.02em; margin: 0; }
      header p { margin: 0; color: var(--text-2); font-size: 12px; }
      .card { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px rgba(27, 36, 50, .05), 0 6px 20px -8px rgba(27, 36, 50, .14); }
      .card p { margin: 0 0 12px; color: var(--text-2); }
      label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); margin: 12px 0 6px; }
      input { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--sep); border-radius: 10px; background: var(--card); color: var(--text); font: inherit; }
      input:focus { outline: 3px solid rgba(234, 91, 37, .18); border-color: var(--orange); }
      button { margin-top: 14px; width: 100%; min-height: 36px; border: 0; border-radius: 10px; background: var(--orange); color: #fff; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: background .15s, transform .1s; }
      button:hover { background: var(--orange-press); }
      button:active { transform: scale(.98); }
      button:disabled { opacity: .6; cursor: default; }
      details { margin-top: 10px; }
      summary { cursor: pointer; color: var(--text-2); font-size: 12px; }
      #status { margin-top: 12px; font-size: 12.5px; min-height: 1em; }
      .ok { color: var(--ok); } .err { color: var(--err); }
      .hint { margin-top: 12px; color: var(--text-2); font-size: 12px; text-align: center; }
      kbd { font-family: inherit; font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 5px; background: var(--fill); }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/hzk-48.png" alt="" />
      <div><h1>Funil HZK</h1><p>Operacional OS no WhatsApp Web</p></div>
    </header>
    <div class="card">
      <p>Cole o token gerado em <b>Prospecção › Funil › Conectar extensão</b>. Depois abra o WhatsApp Web.</p>
      <label for="token">Token</label>
      <input id="token" type="password" placeholder="oos_…" autocomplete="off" />
      <details>
        <summary>Avançado</summary>
        <label for="base">Endereço do sistema</label>
        <input id="base" type="url" placeholder="https://operacional-os.vercel.app" />
      </details>
      <button id="save">Salvar e testar</button>
      <div id="status" role="status"></div>
    </div>
    <div class="hint">No WhatsApp, <kbd>Alt</kbd> + <kbd>F</kbd> mostra ou esconde o painel.</div>
    <script src="popup.js"></script>
  </body>
</html>
